[package]
name = "union-manifold"
version = "3.5.6"
description = "Union.Manifold, a multi source game launcher"
authors = ["fyiel"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "union_manifold_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol", "tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "gzip", "brotli", "rustls-tls", "rustls-tls-native-roots", "charset", "http2"] }
futures = "0.3"
regex = "1"
once_cell = "1"
parking_lot = "0.12"
url = "2"
percent-encoding = "2"
shlex = "2"
unicode-normalization = "0.1"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "5"
tempfile = "3"
walkdir = "2"
fs4 = "0.12"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-notification = "2.3.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_16"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
