name: build and release

on:
  push:
    branches: [main, master]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 2.8.0). Blank uses package.json.'
        required: false
        type: string

# jobs that create or publish the release (check, build, publish) redeclare
# contents: write themselves
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
      releaseId: ${{ steps.draft.outputs.releaseId }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          pkg=$(jq -r .version package.json)
          release=true
          tag_push=0
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
            version="${tag#v}"
            tag_push=1
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION:-$pkg}"
            version="${version#v}"
            tag="v$version"
          else
            version="$pkg"
            tag="v$version"
            old=$(git show "$BEFORE:package.json" 2>/dev/null | jq -r .version 2>/dev/null || echo "")
            if [ "$version" = "$old" ]; then
              echo "version unchanged ($version), no release"
              release=false
            fi
          fi
          # same version-sanity + existing-tag guard on every trigger path so a
          # stray tag or a bogus dispatch input can't release an arbitrary or
          # drifting version
          if [ "$release" = "true" ]; then
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version '$version' is not semver X.Y.Z, refusing to release"
              release=false
            elif [ "$version" != "$pkg" ]; then
              echo "::error::version '$version' does not match package.json ($pkg), refusing to release"
              release=false
            elif [ "$tag_push" = "0" ] && git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::warning::tag $tag already exists (old fork tags run up to v2.7.3). skipping release. bump to a version above the highest existing tag."
              release=false
            else
              echo "releasing $tag"
            fi
          fi
          {
            echo "release=$release"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      # Create the draft release exactly once, before the matrix starts, and
      # hand its numeric id to every build job. Looking drafts up by tag is
      # unreliable (the tag ref does not exist until publish), which left the
      # racing tauri-action jobs creating one draft each and stranding every
      # loser's assets.
      - name: Create draft release
        id: draft
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail
          if ! id=$(gh release view "$TAG" --json databaseId --jq .databaseId 2>/dev/null); then
            id=$(gh api "repos/${{ github.repository }}/releases" \
              -f tag_name="$TAG" \
              -f name="Union.Manifold $TAG" \
              -F draft=true \
              -f target_commitish="$GITHUB_SHA" \
              --jq .id)
          fi
          echo "releaseId=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            sidecars: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            sidecars: win32-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            sidecars: darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            sidecars: darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync version into tauri.conf.json
        shell: bash
        run: |
          set -euo pipefail
          v="${{ needs.check.outputs.version }}"
          tmp=$(mktemp)
          jq --arg v "$v" '.version = $v' src-tauri/tauri.conf.json > "$tmp"
          mv "$tmp" src-tauri/tauri.conf.json
          echo "tauri.conf.json version set to $v"

      - name: Install linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf g++-mingw-w64 rpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch sidecars
        run: bun run fetch-sidecars ${{ matrix.sidecars }}

      - name: Build trainer host
        if: matrix.os == 'ubuntu-22.04'
        run: bun run build:trainer-host

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy's bundled strip can reject newer distro ELF sections.
          NO_STRIP: '1'
        with:
          releaseId: ${{ needs.check.outputs.releaseId }}
          uploadUpdaterJson: 'false'
          args: --target ${{ matrix.target }}

      - name: Upload stable RPM package
        if: matrix.sidecars == 'linux-x64'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rpms=(src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm)
          test -f "${rpms[0]}"
          cp "${rpms[0]}" union-manifold-x86_64.rpm
          gh release upload "${{ needs.check.outputs.tag }}" union-manifold-x86_64.rpm --clobber

      - name: Build and upload pacman package
        if: matrix.sidecars == 'linux-x64'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
        run: |
          bash renderer/scripts/build-arch-pkg.sh "${{ needs.check.outputs.version }}" "${{ matrix.target }}"
          # stable-named copy so the readme one-liner can point at releases/latest
          cp "union-manifold-${{ needs.check.outputs.version }}-1-x86_64.pkg.tar.zst" union-manifold-x86_64.pkg.tar.zst
          # detached pgp signatures so pacman -U can install straight from the url
          # (users trust the key once via union-manifold-signing-key.asc)
          if [ -n "$GPG_SIGNING_KEY" ]; then
            GNUPGHOME=$(mktemp -d)
            export GNUPGHOME
            printf '%s' "$GPG_SIGNING_KEY" | gpg --batch --import
            gpg --batch --yes --detach-sign "union-manifold-${{ needs.check.outputs.version }}-1-x86_64.pkg.tar.zst"
            gpg --batch --yes --detach-sign union-manifold-x86_64.pkg.tar.zst
          fi
          gh release upload "${{ needs.check.outputs.tag }}" union-manifold-*x86_64.pkg.tar.zst* --clobber

  resolver-runtime:
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime builder
        run: python -m pip install pyinstaller==6.20.0
      - name: Build resolver runtime
        run: python renderer/scripts/build-resolver-runtime.py --platform ${{ matrix.platform }} --output resolver-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: resolver-runtime-${{ matrix.platform }}
          path: resolver-runtime/*
          if-no-files-found: error
          retention-days: 3

  resolver-runtime-publish:
    needs: [check, resolver-runtime]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: resolver-runtime-*
          path: resolver-runtime
          merge-multiple: true
      - name: Publish resolver runtime and manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version=$(jq -r .version resolver-runtime/resolver-runtime-linux-x86_64.json)
          slipgate=$(jq -r .slipgateVersion resolver-runtime/resolver-runtime-linux-x86_64.json)
          flaresolverr=$(jq -r .flaresolverrVersion resolver-runtime/resolver-runtime-linux-x86_64.json)
          jq -n \
            --arg version "$version" \
            --arg slipgate "$slipgate" \
            --arg flaresolverr "$flaresolverr" \
            --arg linuxUrl "https://github.com/${{ github.repository }}/releases/download/$TAG/resolver-runtime-linux-x86_64.zip" \
            --arg linuxSha "$(jq -r .sha256 resolver-runtime/resolver-runtime-linux-x86_64.json)" \
            --argjson linuxSize "$(jq -r .size resolver-runtime/resolver-runtime-linux-x86_64.json)" \
            --arg windowsUrl "https://github.com/${{ github.repository }}/releases/download/$TAG/resolver-runtime-windows-x86_64.zip" \
            --arg windowsSha "$(jq -r .sha256 resolver-runtime/resolver-runtime-windows-x86_64.json)" \
            --argjson windowsSize "$(jq -r .size resolver-runtime/resolver-runtime-windows-x86_64.json)" \
            '{version: $version, slipgateVersion: $slipgate, flaresolverrVersion: $flaresolverr,
              platforms: {
                "linux-x86_64": {url: $linuxUrl, sha256: $linuxSha, size: $linuxSize},
                "windows-x86_64": {url: $windowsUrl, sha256: $windowsSha, size: $windowsSize}
              }}' > resolver-runtime/resolver-runtime.json
          bunx @tauri-apps/cli signer sign resolver-runtime/resolver-runtime.json
          gh release upload "$TAG" \
            resolver-runtime/resolver-runtime-linux-x86_64.zip \
            resolver-runtime/resolver-runtime-windows-x86_64.zip \
            resolver-runtime/resolver-runtime.json \
            resolver-runtime/resolver-runtime.json.sig \
            --clobber

  # Everything above builds into a DRAFT release (created once in the check
  # job) so no platform asset or signature is ever public half-uploaded. This
  # job runs only after every matrix build AND the pacman upload succeeded,
  # fills the release notes from the matching CHANGELOG.md section, and
  # publishes it, so a release ships automatically with no manual click.
  publish:
    needs: [check, build, resolver-runtime-publish]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fill notes from changelog and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          # Pull the section under "## <version>" up to the next "## " heading.
          changes=$(awk -v ver="$VERSION" '
            $1 == "##" && $2 == ver { f = 1; next }
            f && /^## / { exit }
            f { print }
          ' CHANGELOG.md)
          # Strip leading and trailing blank lines.
          changes=$(printf '%s\n' "$changes" | awk 'NF {f=1} f' | tac | awk 'NF {f=1} f' | tac)
          if [ -z "$changes" ]; then
            changes="No changelog provided."
          fi
          changes=$(printf '%s\n' "$changes" | perl -CSDA -pe 's/\x{2014}|\x{2013}/-/g')

          asset_base="https://github.com/${{ github.repository }}/releases/download/$TAG"
          {
            printf '# Union.Manifold %s\n\n' "$VERSION"
            printf '## Downloads\n\n'
            printf -- '- [Windows installer](%s/Union.Manifold_%s_x64-setup.exe)\n' "$asset_base" "$VERSION"
            printf -- '- [macOS Apple Silicon](%s/Union.Manifold_%s_aarch64.dmg)\n' "$asset_base" "$VERSION"
            printf -- '- [macOS Intel](%s/Union.Manifold_%s_x64.dmg)\n' "$asset_base" "$VERSION"
            printf -- '- [Linux AppImage](%s/Union.Manifold_%s_amd64.AppImage)\n' "$asset_base" "$VERSION"
            printf -- '- [Linux deb](%s/Union.Manifold_%s_amd64.deb)\n' "$asset_base" "$VERSION"
            printf -- '- [Linux rpm](%s/Union.Manifold-%s-1.x86_64.rpm)\n' "$asset_base" "$VERSION"
            printf -- '- [Linux Arch package](%s/union-manifold-x86_64.pkg.tar.zst)\n' "$asset_base"
            printf '\n## Changes\n\n'
            printf '%s\n' "$changes"
          } > notes.md
          {
            printf 'Union.Manifold %s\n\n%s\n' "$VERSION" "$changes"
          } > updater-notes.md
          echo "----- release notes -----"; cat notes.md; echo "-------------------------"
          # Build the updater manifest once, here, from the release's own
          # signature files: the matrix jobs' own latest.json uploads race
          # read-modify-write on the same asset, so a losing job's platform
          # silently drops out of the manifest.
          sigs=$(mktemp -d)
          gh release download "$TAG" --pattern "*.sig" --dir "$sigs" --clobber || true
          dl="https://github.com/${{ github.repository }}/releases/latest/download"
          missing=0
          entries=$(mktemp)
          add_entry() {
            local key="$1" sig_name="$2" asset="$3"
            if [ -f "$sigs/$sig_name" ]; then
              jq -n --arg key "$key" --rawfile signature "$sigs/$sig_name" \
                --arg url "$dl/$asset" \
                '{ ($key): { signature: $signature, url: $url } }' >> "$entries"
            else
              echo "::error::updater signature missing for $key ($sig_name) - this platform will not receive auto-updates for v$VERSION"
              missing=$((missing + 1))
            fi
          }
          for spec in \
            "linux-x86_64|Union.Manifold_${VERSION}_amd64.AppImage.sig|Union.Manifold_${VERSION}_amd64.AppImage" \
            "linux-x86_64-appimage|Union.Manifold_${VERSION}_amd64.AppImage.sig|Union.Manifold_${VERSION}_amd64.AppImage" \
            "linux-x86_64-deb|Union.Manifold_${VERSION}_amd64.deb.sig|Union.Manifold_${VERSION}_amd64.deb" \
            "linux-x86_64-rpm|Union.Manifold-${VERSION}-1.x86_64.rpm.sig|Union.Manifold-${VERSION}-1.x86_64.rpm" \
            "darwin-x86_64|Union.Manifold_x64.app.tar.gz.sig|Union.Manifold_x64.app.tar.gz" \
            "darwin-x86_64-app|Union.Manifold_x64.app.tar.gz.sig|Union.Manifold_x64.app.tar.gz" \
            "darwin-aarch64|Union.Manifold_aarch64.app.tar.gz.sig|Union.Manifold_aarch64.app.tar.gz" \
            "darwin-aarch64-app|Union.Manifold_aarch64.app.tar.gz.sig|Union.Manifold_aarch64.app.tar.gz" \
            "windows-x86_64|Union.Manifold_${VERSION}_x64-setup.exe.sig|Union.Manifold_${VERSION}_x64-setup.exe" \
            "windows-x86_64-nsis|Union.Manifold_${VERSION}_x64-setup.exe.sig|Union.Manifold_${VERSION}_x64-setup.exe"; do
            IFS='|' read -r key sig_name asset <<< "$spec"
            add_entry "$key" "$sig_name" "$asset"
          done
          if [ -s "$entries" ]; then
            jq -n \
              --arg v "$VERSION" \
              --arg pub "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --rawfile notes updater-notes.md \
              --slurpfile plats "$entries" \
              '{ version: $v, notes: $notes, pub_date: $pub,
                 platforms: ($plats | add) }' > latest.json
            gh release upload "$TAG" latest.json --clobber
          else
            echo "::error::no updater signatures found on release $TAG at all - not uploading any updater manifest"
          fi
          rm -f "$entries"
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing updater platform(s) skipped due to missing signatures - fix the flaky upload before relying on auto-update"
          fi
          gh release edit "$TAG" --notes-file notes.md --draft=false --latest
