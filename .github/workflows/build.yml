name: build and release

on:
  push:
    branches: [main, master]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 2.8.0). Blank uses package.json.'
        required: false
        type: string

# jobs that release (build) redeclare contents: write themselves
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          pkg=$(jq -r .version package.json)
          release=true
          tag_push=0
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
            version="${tag#v}"
            tag_push=1
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION:-$pkg}"
            version="${version#v}"
            tag="v$version"
          else
            version="$pkg"
            tag="v$version"
            old=$(git show "$BEFORE:package.json" 2>/dev/null | jq -r .version 2>/dev/null || echo "")
            if [ "$version" = "$old" ]; then
              echo "version unchanged ($version), no release"
              release=false
            fi
          fi
          # same version-sanity + existing-tag guard on every trigger path so a
          # stray tag or a bogus dispatch input can't release an arbitrary or
          # drifting version
          if [ "$release" = "true" ]; then
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version '$version' is not semver X.Y.Z, refusing to release"
              release=false
            elif [ "$version" != "$pkg" ]; then
              echo "::error::version '$version' does not match package.json ($pkg), refusing to release"
              release=false
            elif [ "$tag_push" = "0" ] && git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::warning::tag $tag already exists (old fork tags run up to v2.7.3). skipping release. bump to a version above the highest existing tag."
              release=false
            else
              echo "releasing $tag"
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            sidecars: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            sidecars: win32-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            sidecars: darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            sidecars: darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync version into tauri.conf.json
        shell: bash
        run: |
          set -euo pipefail
          v="${{ needs.check.outputs.version }}"
          tmp=$(mktemp)
          jq --arg v "$v" '.version = $v' src-tauri/tauri.conf.json > "$tmp"
          mv "$tmp" src-tauri/tauri.conf.json
          echo "tauri.conf.json version set to $v"

      - name: Install linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Fetch sidecars
        run: pnpm fetch-sidecars ${{ matrix.sidecars }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.check.outputs.tag }}
          releaseName: 'Union.Manifold ${{ needs.check.outputs.tag }}'
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Build and upload pacman package
        if: matrix.sidecars == 'linux-x64'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/build-arch-pkg.sh "${{ needs.check.outputs.version }}" "${{ matrix.target }}"
          gh release upload "${{ needs.check.outputs.tag }}" union-manifold-*.pkg.tar.zst --clobber
