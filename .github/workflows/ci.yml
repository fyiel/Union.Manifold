name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            sidecars: linux-x64
          - os: windows-latest
            sidecars: win32-x64
          - os: macos-latest
            sidecars: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf g++-mingw-w64

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch sidecars
        run: bun run fetch-sidecars ${{ matrix.sidecars }}

      - name: Build trainer host
        if: matrix.os == 'ubuntu-22.04'
        run: bun run build:trainer-host

      - name: Build renderer
        run: bun run build:renderer

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --locked

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Cargo test
        working-directory: src-tauri
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cargo test --locked --no-run --message-format=json > test-build.json || exit 1
            MT=$(find "/c/Program Files (x86)/Windows Kits/10/bin" -name "mt.exe" -path "*x64*" 2>/dev/null | sort -V | tail -1)
            MANIFEST=$(cygpath -w "$PWD/windows/test-manifest.manifest")
            jq -r 'select(.executable != null) | .executable' test-build.json | tr -d '\r' > test-exes.txt
            while IFS= read -r exe; do
              chmod +w "$exe"
              "$MT" -nologo -manifest "$MANIFEST" "-outputresource:$exe;#1" || exit 1
            done < test-exes.txt
            status=0
            while IFS= read -r exe; do
              "$exe" || status=1
            done < test-exes.txt
            exit $status
          fi
          cargo test --locked

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert version single-source
        run: |
          set -euo pipefail
          pkg=$(jq -r .version package.json)
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          cargo=$(awk -F'"' '/^version[[:space:]]*=/{print $2; exit}' src-tauri/Cargo.toml)
          if [ "$pkg" != "$conf" ] || [ "$pkg" != "$cargo" ]; then
            echo "::error::version drift: package.json=$pkg tauri.conf.json=$conf Cargo.toml=$cargo"
            exit 1
          fi
          echo "versions aligned at $pkg"

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck renderer
        run: bun run typecheck
